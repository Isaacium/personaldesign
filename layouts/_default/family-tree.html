{{ define "main" }}
<div class="jiapu-pdf-app">
  <!-- Minimal Floating Control Bar -->
  <div class="pdf-toolbar" id="pdf-toolbar">
    <div class="toolbar-left">
      <a href="{{ .Site.BaseURL }}" class="tb-btn home-link" title="Back to Home">
        <i class="fas fa-arrow-left"></i> Home
      </a>
      <span class="tb-divider"></span>
      <span class="tb-title">山东省 · 劉氏家谱 (Liu &amp; Yi Family Tree)</span>
    </div>

    <div class="toolbar-center">
      <!-- Toggle for Men=Squares / Women=Circles -->
      <button id="toggle-shapes-btn" class="tb-btn shape-toggle-btn active" onclick="toggleGenderShapes()" title="Toggle Squares (Men) and Circles (Women)">
        <span class="toggle-icon-box"></span>
        <span class="toggle-icon-circle"></span>
        <span id="toggle-shapes-label">男方女圆: ON (Men = Squares, Women = Circles)</span>
      </button>

      <!-- Search Box -->
      <div class="tb-search">
        <i class="fas fa-search"></i>
        <input type="text" id="pdf-search-input" placeholder="Search name (e.g. Isaac, CiCi, 应广, 伊爱华, 朱承)..." oninput="handlePdfSearch(this.value)" autocomplete="off">
        <button id="pdf-search-clear" class="tb-clear" onclick="clearPdfSearch()" style="display:none;"><i class="fas fa-times"></i></button>
        <span id="pdf-search-count" class="tb-count" style="display:none;">0</span>
      </div>
    </div>

    <div class="toolbar-right">
      <button class="tb-btn" onclick="zoomInPdf()" title="Zoom In (+)"><i class="fas fa-search-plus"></i></button>
      <button class="tb-btn" onclick="zoomOutPdf()" title="Zoom Out (-)"><i class="fas fa-search-minus"></i></button>
      <button class="tb-btn" onclick="fitPdfToScreen()" title="Fit to Screen"><i class="fas fa-compress-arrows-alt"></i> Fit</button>
      <button class="tb-btn" onclick="resetPdfZoom()" title="100% Actual Size">100%</button>
      <button class="tb-btn" onclick="downloadJiapuSvg()" title="Download SVG"><i class="fas fa-download"></i> SVG</button>
      <button class="tb-btn" onclick="window.print()" title="Print"><i class="fas fa-print"></i></button>
    </div>
  </div>

  <!-- Main Interactive White Viewport -->
  <div id="pdf-viewport" class="pdf-viewport">
    <div id="pdf-canvas" class="pdf-canvas">
      <svg id="jiapu-svg" class="jiapu-svg show-gender-shapes" viewBox="0 0 3900 2220" width="3900" height="2220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <style>
            .jiapu-svg {
              background-color: #ffffff;
              font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", "Source Han Serif SC", "PMingLiU", "Times New Roman", serif;
              user-select: none;
            }
            .header-prov-cn {
              font-size: 32px;
              font-weight: 500;
              fill: #000000;
              text-anchor: middle;
              letter-spacing: 4px;
            }
            .header-prov-en {
              font-size: 24px;
              font-weight: 400;
              fill: #000000;
              text-anchor: middle;
              font-family: "Times New Roman", Times, Georgia, serif;
            }
            .header-clan {
              font-size: 40px;
              font-weight: 600;
              fill: #000000;
              text-anchor: middle;
              font-family: "Songti SC", "SimSun", "Times New Roman", serif;
            }
            /* Tree connector lines */
            .tree-line {
              stroke: #000000;
              stroke-width: 1.5px;
              fill: none;
              stroke-linecap: square;
            }
            .marriage-line {
              stroke: #000000;
              stroke-width: 1.3px;
              fill: none;
            }
            /* Birth order numerals on stems */
            .order-bg {
              fill: #ffffff;
            }
            .order-text {
              font-size: 13px;
              fill: #000000;
              text-anchor: middle;
              dominant-baseline: central;
              font-family: "Songti SC", "SimSun", serif;
            }
            /* Small PDF-style node ring above children */
            .pdf-node-ring {
              fill: #ffffff;
              stroke: #000000;
              stroke-width: 1.5px;
              transition: opacity 0.15s ease;
            }
            /* Gender shapes: Men = Black Squares, Women = Red Circles */
            .gender-shape {
              fill: #ffffff;
              stroke-width: 1.6px;
              opacity: 0;
              transition: opacity 0.15s ease, stroke-width 0.15s ease, fill 0.15s ease;
            }
            .male-square {
              stroke: #000000;
            }
            .female-circle {
              stroke: #c00000;
            }
            /* When .show-gender-shapes is active on SVG */
            .show-gender-shapes .gender-shape {
              opacity: 1;
            }
            .show-gender-shapes .pdf-node-ring {
              opacity: 0;
            }
            /* Person text styles */
            .person-group {
              cursor: pointer;
            }
            .person-group:hover .gender-shape {
              stroke-width: 2.6px;
              fill: #fffdf5;
            }
            .person-group:hover text {
              font-weight: bold;
            }
            .name-cn-male {
              font-size: 15px;
              fill: #000000;
              text-anchor: middle;
            }
            .name-py-male {
              font-size: 9.5px;
              fill: #000000;
              text-anchor: middle;
              font-family: "Times New Roman", Times, serif;
            }
            .name-cn-female {
              font-size: 15px;
              fill: #c00000;
              text-anchor: middle;
            }
            .name-py-female {
              font-size: 9.5px;
              fill: #c00000;
              text-anchor: middle;
              font-family: "Times New Roman", Times, serif;
            }
            /* Search highlight */
            .person-group.search-match .gender-shape {
              opacity: 1 !important;
              fill: #fef08a !important;
              stroke: #ca8a04 !important;
              stroke-width: 3px !important;
            }
            .person-group.search-match .pdf-node-ring {
              fill: #fef08a !important;
              stroke: #ca8a04 !important;
              stroke-width: 3px !important;
            }
          </style>
        </defs>

        <!-- Pure White Background Rect -->
        <rect x="0" y="0" width="3900" height="2220" fill="#ffffff" />

        <!-- Top Center Header (Exact PDF Match) -->
        <g transform="translate(2000, 0)">
          <text x="0" y="65" class="header-prov-cn">山东省</text>
          <text x="0" y="95" class="header-prov-en">Shandong</text>
          <text x="0" y="142" class="header-clan">劉 Liu</text>
        </g>

        <!-- Centerpiece Dragon from dragon-146031.svg -->
        <!-- Placed so the upper neck/wing channel aligns with x=2000 and the tail tip lands right above 向荣 (x=2000, y=1025) -->
        <image href="/img/dragon-146031.svg" x="1835" y="240" width="355" height="727" opacity="0.92" />

        <!-- Layer for Connecting Lines -->
        <g id="svg-lines-layer"></g>

        <!-- Layer for Person Nodes -->
        <g id="svg-nodes-layer"></g>
      </svg>
    </div>
  </div>

  <!-- Minimal Person Info Popover -->
  <div id="person-popover" class="person-popover" style="display:none;">
    <div class="pop-header">
      <span id="pop-shape" class="pop-shape"></span>
      <div>
        <strong id="pop-title">Name</strong>
        <span id="pop-sub" class="pop-sub">Subtitle</span>
      </div>
      <button class="pop-close" onclick="closePopover()"><i class="fas fa-times"></i></button>
    </div>
    <div class="pop-body">
      <div class="pop-row"><span>Generation:</span> <strong id="pop-gen">-</strong></div>
      <div class="pop-row"><span>Branch:</span> <strong id="pop-branch">-</strong></div>
      <div class="pop-row"><span>Parents:</span> <strong id="pop-parents">-</strong></div>
      <div class="pop-row"><span>Spouse:</span> <strong id="pop-spouse">-</strong></div>
      <div class="pop-row"><span>Children:</span> <strong id="pop-children">-</strong></div>
    </div>
  </div>
</div>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const linesLayer = document.getElementById("svg-lines-layer");
const nodesLayer = document.getElementById("svg-nodes-layer");

// Dimensions for Square (Male) and Circle (Female)
const BOX_SIZE = 54;          // 54x54 true square for men
const BOX_HALF = BOX_SIZE / 2; // 27
const CIRCLE_R = 27;          // r=27 (diameter 54) true circle for women
const RING_OFFSET_Y = -20;    // PDF small ring offset when shapes are off

// Helper to create SVG elements
function svgEl(tag, attrs = {}) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    el.setAttribute(k, v);
  }
  return el;
}

// Draw a straight line
function drawLine(x1, y1, x2, y2, cls = "tree-line") {
  linesLayer.appendChild(svgEl("line", { x1, y1, x2, y2, class: cls }));
}

// Draw birth order numeral on a vertical stem
function drawOrderNum(x, y, orderStr) {
  if (!orderStr) return;
  const g = svgEl("g", { transform: `translate(${x}, ${y})` });
  g.appendChild(svgEl("rect", { x: -8, y: -8, width: 16, height: 16, class: "order-bg" }));
  const t = svgEl("text", { x: 0, y: 0, class: "order-text" });
  t.textContent = orderStr;
  g.appendChild(t);
  linesLayer.appendChild(g);
}

/**
 * Draw an individual person node centered at (x, y).
 * Men: Black text, Black square (54x54)
 * Women: Red text, Red circle (r=27)
 */
function drawPersonNode(p) {
  const {
    x, y, cn, py = "", gender = "M",
    order = "", hasTopRing = false,
    meta = {}
  } = p;

  const isMale = gender === "M";
  const g = svgEl("g", {
    class: "person-group",
    transform: `translate(${x}, ${y})`,
    "data-search": `${cn} ${py} ${meta.en || ""} ${meta.note || ""}`.toLowerCase()
  });

  // 1. Gender Shape (Square for M, Circle for F)
  if (isMale) {
    g.appendChild(svgEl("rect", {
      x: -BOX_HALF,
      y: -BOX_HALF,
      width: BOX_SIZE,
      height: BOX_SIZE,
      class: "gender-shape male-square"
    }));
  } else {
    g.appendChild(svgEl("circle", {
      cx: 0,
      cy: 0,
      r: CIRCLE_R,
      class: "gender-shape female-circle"
    }));
  }

  // 2. Small PDF-style top ring (visible when gender shapes are toggled OFF)
  if (hasTopRing) {
    g.appendChild(svgEl("circle", {
      cx: 0,
      cy: -22,
      r: 5,
      class: "pdf-node-ring"
    }));
  }

  // 3. Name & Pinyin/Subtitle Text
  const cnClass = isMale ? "name-cn-male" : "name-cn-female";
  const pyClass = isMale ? "name-py-male" : "name-py-female";

  if (py) {
    const tCn = svgEl("text", { x: 0, y: -2, class: cnClass });
    tCn.textContent = cn;
    g.appendChild(tCn);

    const tPy = svgEl("text", { x: 0, y: 12, class: pyClass });
    tPy.textContent = py;
    g.appendChild(tPy);
  } else {
    const tCn = svgEl("text", { x: 0, y: 5, class: cnClass });
    tCn.textContent = cn;
    g.appendChild(tCn);
  }

  // Click handler for popover
  g.addEventListener("click", (e) => {
    e.stopPropagation();
    openPopover(p);
  });

  nodesLayer.appendChild(g);
}

/**
 * Draw a family unit (Primary person + 0 or more spouses)
 * Returns attachment points for parent drop-in and child drop-out.
 */
function drawUnit(cfg) {
  const {
    x, y,
    cn, py = "", gender = "M",
    order = "",
    hasParent = true,
    spouses = [], // Array of { cn, py, gender }
    meta = {}
  } = cfg;

  // Draw primary person at (x, y)
  drawPersonNode({
    x, y, cn, py, gender, order,
    hasTopRing: hasParent,
    meta: {
      ...meta,
      spouseNames: spouses.map(s => `${s.cn}${s.py ? ' (' + s.py + ')' : ''}`).join(", ") || "-"
    }
  });

  const spouseGap = 68; // center-to-center distance between spouses

  if (spouses.length === 1) {
    const sp = spouses[0];
    const sx = x + spouseGap;
    // Horizontal marriage line between right edge of primary and left edge of spouse
    drawLine(x + BOX_HALF, y, sx - BOX_HALF, y, "marriage-line");
    drawPersonNode({
      x: sx, y,
      cn: sp.cn, py: sp.py || "",
      gender: sp.gender || (gender === "M" ? "F" : "M"),
      hasTopRing: false,
      meta: {
        gen: meta.gen,
        branch: meta.branch,
        parents: sp.parents || "-",
        spouseNames: `${cn}${py ? ' (' + py + ')' : ''}`,
        children: meta.children || "-"
      }
    });
  } else if (spouses.length === 4) {
    // 2x2 grid of 4 wives (as in 长龄 in the PDF)
    const midX = x + 36;
    drawLine(x + BOX_HALF, y, midX, y, "marriage-line");
    drawLine(midX, y - 28, midX, y + 28, "marriage-line");
    const positions = [
      { sx: x + 68, sy: y - 28 },
      { sx: x + 132, sy: y - 28 },
      { sx: x + 68, sy: y + 28 },
      { sx: x + 132, sy: y + 28 }
    ];
    drawLine(midX, y - 28, x + 68 - BOX_HALF, y - 28, "marriage-line");
    drawLine(x + 68 + BOX_HALF, y - 28, x + 132 - BOX_HALF, y - 28, "marriage-line");
    drawLine(midX, y + 28, x + 68 - BOX_HALF, y + 28, "marriage-line");
    drawLine(x + 68 + BOX_HALF, y + 28, x + 132 - BOX_HALF, y + 28, "marriage-line");

    spouses.forEach((sp, idx) => {
      const pos = positions[idx];
      drawPersonNode({
        x: pos.sx, y: pos.sy,
        cn: sp.cn, py: sp.py || "",
        gender: sp.gender || "F",
        hasTopRing: false,
        meta: {
          gen: meta.gen,
          branch: meta.branch,
          parents: "-",
          spouseNames: `${cn} (${py})`,
          children: meta.children || "-"
        }
      });
    });
  } else if (spouses.length > 1) {
    // Multiple wives stacked vertically (like 长辉, 向荣, 长兰, 文华, 文耀)
    const sx = x + spouseGap;
    const totalH = (spouses.length - 1) * 56;
    const startY = y - totalH / 2;
    const midX = x + spouseGap / 2;

    drawLine(x + BOX_HALF, y, midX, y, "marriage-line");
    drawLine(midX, startY, midX, startY + totalH, "marriage-line");

    spouses.forEach((sp, idx) => {
      const sy = startY + idx * 56;
      drawLine(midX, sy, sx - BOX_HALF, sy, "marriage-line");
      drawPersonNode({
        x: sx, y: sy,
        cn: sp.cn, py: sp.py || "",
        gender: sp.gender || "F",
        hasTopRing: false,
        meta: {
          gen: meta.gen,
          branch: meta.branch,
          parents: "-",
          spouseNames: `${cn} (${py})`,
          children: meta.children || "-"
        }
      });
    });
  }

  return {
    x,
    y,
    topY: y - BOX_HALF,
    bottomY: y + BOX_HALF,
    order
  };
}

/**
 * Connect a parent anchor (px, pyBottom) to an array of children anchors
 */
function connectChildren(px, pyBottom, busY, children) {
  if (!children || children.length === 0) return;

  if (children.length === 1) {
    const ch = children[0];
    if (Math.abs(ch.x - px) < 2) {
      drawLine(px, pyBottom, ch.x, ch.topY);
      if (ch.order) {
        drawOrderNum(ch.x, (pyBottom + ch.topY) / 2, ch.order);
      }
    } else {
      drawLine(px, pyBottom, px, busY);
      drawLine(px, busY, ch.x, busY);
      drawLine(ch.x, busY, ch.x, ch.topY);
      if (ch.order) {
        drawOrderNum(ch.x, (busY + ch.topY) / 2, ch.order);
      }
    }
    return;
  }

  // Drop from parent to horizontal sibling bar
  drawLine(px, pyBottom, px, busY);

  // Horizontal bar from leftmost child to rightmost child
  const xs = children.map(c => c.x);
  const minX = Math.min(...xs, px);
  const maxX = Math.max(...xs, px);
  drawLine(minX, busY, maxX, busY);

  // Vertical stems to each child
  children.forEach(ch => {
    drawLine(ch.x, busY, ch.x, ch.topY);
    if (ch.order) {
      drawOrderNum(ch.x, busY + (ch.topY - busY) * 0.48, ch.order);
    }
  });
}

// ============================================================================
// BUILD THE ENTIRE JIAPU TREE (EXACT PDF + AIHUA YI LINE + CONTEMPORARY LINE)
// ============================================================================
function buildFullJiapuTree() {
  // --------------------------------------------------------------------------
  // 1. CENTRAL ANCESTRAL SPINE (Gen 1 to Gen 6: 君志 -> 法商)
  // --------------------------------------------------------------------------
  const CX = 2000;
  const g1_junzhi = drawUnit({
    x: CX, y: 185, cn: "君志", py: "junzhi", gender: "M", hasParent: false,
    meta: { gen: "1世 (Gen 1)", branch: "山东刘氏始祖", parents: "-", children: "希贤" }
  });
  const g2_xixian = drawUnit({
    x: CX, y: 268, cn: "希贤", py: "xixian", gender: "M", order: "一",
    meta: { gen: "2世 (Gen 2)", branch: "山东刘氏", parents: "君志", children: "清" }
  });

// INTERACTIVITY: TOGGLE SHAPES, SEARCH, PAN & ZOOM, POPOVER, DOWNLOAD
// ============================================================================
let shapesEnabled = true;

function toggleGenderShapes() {
  shapesEnabled = !shapesEnabled;
  const svg = document.getElementById("jiapu-svg");
  const btn = document.getElementById("toggle-shapes-btn");
  const lbl = document.getElementById("toggle-shapes-label");

  if (shapesEnabled) {
    svg.classList.add("show-gender-shapes");
    btn.classList.add("active");
    lbl.textContent = "男方女圆: ON (Men = Squares, Women = Circles)";
  } else {
    svg.classList.remove("show-gender-shapes");
    btn.classList.remove("active");
    lbl.textContent = "男方女圆: OFF (Original PDF Style)";
  }
}

function openPopover(p) {
  const pop = document.getElementById("person-popover");
  const shape = document.getElementById("pop-shape");
  const isMale = p.gender === "M";

  shape.className = "pop-shape " + (isMale ? "male" : "female");
  document.getElementById("pop-title").textContent = `${p.cn}${p.py ? ' (' + p.py + ')' : ''}`;
  document.getElementById("pop-sub").textContent = isMale
    ? "Male (M) · Black Square"
    : "Female (F) · Red Circle";

  const m = p.meta || {};
  document.getElementById("pop-gen").textContent = m.gen || "-";
  document.getElementById("pop-branch").textContent = m.branch || "-";
  document.getElementById("pop-parents").textContent = m.parents || "-";
  document.getElementById("pop-spouse").textContent = m.spouseNames || "-";
  document.getElementById("pop-children").textContent = m.children || "-";

  pop.style.display = "block";
}

function closePopover() {
  document.getElementById("person-popover").style.display = "none";
}

function handlePdfSearch(q) {
  q = q.trim().toLowerCase();
  const clearBtn = document.getElementById("pdf-search-clear");
  const countBadge = document.getElementById("pdf-search-count");
  const groups = document.querySelectorAll(".person-group");

  if (!q) {
    clearBtn.style.display = "none";
    countBadge.style.display = "none";
    groups.forEach(g => g.classList.remove("search-match"));
    return;
  }

  clearBtn.style.display = "block";
  let matches = 0;
  groups.forEach(g => {
    const hay = g.getAttribute("data-search") || "";
    if (hay.includes(q)) {
      g.classList.add("search-match");
      matches++;
    } else {
      g.classList.remove("search-match");
    }
  });

  countBadge.textContent = matches;
  countBadge.style.display = "inline-block";
}

function clearPdfSearch() {
  const input = document.getElementById("pdf-search-input");
  input.value = "";
  handlePdfSearch("");
}

// Pan & Zoom State
let pScale = 0.45;
let pPanX = 0;
let pPanY = 0;
let pDragging = false;
let pStartX = 0;
let pStartY = 0;

function updatePdfTransform() {
  const canvas = document.getElementById("pdf-canvas");
  canvas.style.transform = `translate(${pPanX}px, ${pPanY}px) scale(${pScale})`;
}

function fitPdfToScreen() {
  const vp = document.getElementById("pdf-viewport");
  const vW = vp.clientWidth;
  const vH = vp.clientHeight;
  const svgW = 3900;
  const svgH = 2220;

  pScale = Math.min((vW - 30) / svgW, (vH - 30) / svgH);
  pPanX = Math.max((vW - svgW * pScale) / 2, 10);
  pPanY = Math.max((vH - svgH * pScale) / 2, 10);
  updatePdfTransform();
}

function zoomInPdf() {
  pScale = Math.min(pScale * 1.25, 3.0);
  updatePdfTransform();
}

function zoomOutPdf() {
  pScale = Math.max(pScale * 0.8, 0.15);
  updatePdfTransform();
}

function resetPdfZoom() {
  pScale = 1.0;
  pPanX = 20;
  pPanY = 20;
  updatePdfTransform();
}

function downloadJiapuSvg() {
  const svg = document.getElementById("jiapu-svg");
  const serializer = new XMLSerializer();
  let src = serializer.serializeToString(svg);
  const blob = new Blob([src], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "liu-family-tree-jiapu.svg";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.addEventListener("DOMContentLoaded", () => {
  buildFullJiapuTree();
  fitPdfToScreen();

  const vp = document.getElementById("pdf-viewport");

  vp.addEventListener("mousedown", (e) => {
    if (e.target.closest(".person-popover")) return;
    pDragging = true;
    pStartX = e.clientX - pPanX;
    pStartY = e.clientY - pPanY;
  });

  window.addEventListener("mousemove", (e) => {
    if (!pDragging) return;
    pPanX = e.clientX - pStartX;
    pPanY = e.clientY - pStartY;
    updatePdfTransform();
  });

  window.addEventListener("mouseup", () => {
    pDragging = false;
  });

  vp.addEventListener("wheel", (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.88;
    const rect = vp.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const nextScale = Math.min(Math.max(pScale * factor, 0.15), 3.0);
    pPanX = mx - (mx - pPanX) * (nextScale / pScale);
    pPanY = my - (my - pPanY) * (nextScale / pScale);
    pScale = nextScale;
    updatePdfTransform();
  }, { passive: false });

  window.addEventListener("resize", fitPdfToScreen);
});
